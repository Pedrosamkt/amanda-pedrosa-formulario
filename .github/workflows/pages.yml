name: Publicar a página

# Toda vez que algo mudar nesta branch, o site é republicado sozinho.
# Também dá para publicar na mão pela aba Actions (botão "Run workflow").
on:
  push:
    branches: [claude/capture-page-ted-sonsantos-o1kzm2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar o site
        # Só o que o navegador precisa. README e o script da planilha ficam
        # no repositório, mas fora do ar.
        run: |
          mkdir -p _site
          cp index.html versao-escura.html politica-de-privacidade.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
          echo "Publicando:" && find _site -type f | sort

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
